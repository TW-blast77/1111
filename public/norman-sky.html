<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Norman Sky</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;}
canvas{display:block;position:fixed;top:0;left:0;touch-action:none;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10;}
.panel{position:absolute;background:rgba(0,15,30,0.78);border:1px solid rgba(0,255,255,0.25);
  border-radius:8px;padding:6px 10px;font:11px/1.5 'Courier New',monospace;color:#7df;
  backdrop-filter:blur(6px);}
#p-tl{top:10px;left:10px;}
#p-tr{top:10px;right:10px;text-align:right;}
#p-mid{top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;
  font-size:15px;color:#fa0;letter-spacing:1px;}
.lbl{font-size:9px;color:rgba(100,200,255,0.55);margin-top:3px;}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,0.1);margin:2px 0;}
.bar-f{height:5px;border-radius:3px;background:linear-gradient(90deg,#0af,#07f);}
.bar-s{height:5px;border-radius:3px;background:linear-gradient(90deg,#0f8,#090);}

/* Prompt */
#prompt{position:fixed;bottom:180px;left:50%;transform:translateX(-50%);
  background:rgba(0,255,180,0.15);border:1px solid rgba(0,255,180,0.5);
  color:#0fc;padding:7px 18px;border-radius:20px;font:13px 'Courier New',monospace;
  z-index:20;pointer-events:none;display:none;animation:blink 1.1s infinite;white-space:nowrap;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* Minimap */
#minimap{position:fixed;right:10px;bottom:160px;width:110px;height:110px;
  border:1px solid rgba(0,255,255,0.3);border-radius:50%;overflow:hidden;
  background:rgba(0,8,18,.85);z-index:15;pointer-events:none;}
#minimap canvas{border-radius:50%;}

/* Touch UI */
#touch-ui{position:fixed;bottom:0;left:0;right:0;height:160px;z-index:30;pointer-events:none;}

/* Joystick */
#joy-zone{position:absolute;left:0;bottom:0;width:50%;height:100%;pointer-events:auto;}
#joy-base{position:absolute;border-radius:50%;background:rgba(0,200,255,0.08);
  border:2px solid rgba(0,200,255,0.3);display:none;transform:translate(-50%,-50%);}
#joy-knob{position:absolute;border-radius:50%;background:rgba(0,200,255,0.5);
  border:2px solid rgba(0,255,255,0.8);transform:translate(-50%,-50%);}

/* Right buttons */
#btn-area{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;
  gap:10px;align-items:flex-end;pointer-events:auto;}
.btn{width:60px;height:60px;border-radius:50%;border:2px solid rgba(0,255,200,.6);
  background:rgba(0,30,50,.7);color:#0fc;font:bold 12px 'Courier New',monospace;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  text-align:center;line-height:1.2;user-select:none;-webkit-user-select:none;
  pointer-events:auto;backdrop-filter:blur(4px);}
.btn:active,.btn.pressed{background:rgba(0,200,150,.35);border-color:#0ff;}
#btn-action{width:70px;height:70px;font-size:20px;border-color:rgba(0,255,180,.7);}
#btn-boost{width:52px;height:52px;font-size:11px;border-color:rgba(255,200,0,.5);color:#fa0;}
#zoom-row{display:flex;gap:8px;}
#btn-zi,#btn-zo{width:44px;height:44px;font-size:20px;font-weight:bold;}

/* Transition */
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:100;transition:opacity .7s;}

/* PC controls hint */
#hint{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);
  color:rgba(0,200,255,.3);font:10px 'Courier New',monospace;pointer-events:none;
  z-index:20;white-space:nowrap;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel" id="p-tl">
    <div style="font-size:12px;color:#0ff;letter-spacing:2px">◈ NAVIGATOR</div>
    <div class="lbl">座標</div><div id="coords" style="color:#aef;font-size:10px">0, 0</div>
    <div class="lbl">速度</div><div id="spd">0.0</div>
    <div class="lbl">燃料</div><div class="bar"><div class="bar-f" id="bf" style="width:100%"></div></div>
    <div class="lbl">護盾</div><div class="bar"><div class="bar-s" id="bs" style="width:100%"></div></div>
  </div>
  <div class="panel" id="p-tr">
    <div style="font-size:12px;color:#0ff;letter-spacing:2px">◈ SCANNER</div>
    <div class="lbl">已發現</div><div id="disc" style="color:#fa0;font-size:14px">0 行星</div>
    <div class="lbl">附近</div><div id="near" style="font-size:10px">掃描中</div>
    <div class="lbl">狀態</div><div id="stat" style="color:#0f8;font-size:10px">探索中</div>
  </div>
  <div class="panel" id="p-mid"></div>
</div>

<div id="minimap"><canvas id="mc" width="110" height="110"></canvas></div>

<div id="prompt"></div>

<div id="touch-ui">
  <div id="joy-zone">
    <div id="joy-base" style="width:100px;height:100px;">
      <div id="joy-knob" style="width:44px;height:44px;top:50%;left:50%;"></div>
    </div>
  </div>
  <div id="btn-area">
    <div id="zoom-row">
      <div class="btn" id="btn-zi">+</div>
      <div class="btn" id="btn-zo">−</div>
    </div>
    <div class="btn" id="btn-boost">⚡<br>加速</div>
    <div class="btn" id="btn-action">E</div>
  </div>
</div>

<div id="hint">WASD/方向鍵移動 · E進入星球 · 滾輪縮放</div>
<div id="fade"></div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mc = document.getElementById('mc');
const mctx = mc.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

// ── PRNG ─────────────────────────────────────────────────────────────────
function srng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/0x100000000;};}
function h2(x,y){return Math.abs((x*73856093)^(y*19349663))%2147483647;}

// ── State ─────────────────────────────────────────────────────────────────
const ST={SPACE:'space',PLANET:'planet',TRANS:'trans'};
let gs=ST.SPACE, time=0, camShake=0;

const cam={x:0,y:0,zoom:1};
const pl={
  x:0,y:0,vx:0,vy:0,angle:-Math.PI/2,fuel:100,shield:100,speed:0,
  sx:3000,sy:0,svx:0,svy:0,grounded:false
};

const keys={};
let discovered=new Set(), nearPlanet=null, surface=null;

// ── Touch ─────────────────────────────────────────────────────────────────
const JOY={active:false,id:null,bx:0,by:0,kx:0,ky:0,dx:0,dy:0,R:50};
const PINCH={active:false,d:0};
let touchBoost=false, touchAction=false;

function joyBase(){return document.getElementById('joy-base');}
function joyKnob(){return document.getElementById('joy-knob');}

function setJoyVis(on,bx,by){
  const b=joyBase(),k=joyKnob();
  if(on){
    b.style.display='block';
    b.style.left=bx+'px'; b.style.top=by+'px';
    k.style.left='50%'; k.style.top='50%';
  } else {
    b.style.display='none';
    JOY.dx=0; JOY.dy=0;
  }
}

document.getElementById('joy-zone').addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(!JOY.active){
      JOY.active=true; JOY.id=t.identifier;
      const z=document.getElementById('joy-zone').getBoundingClientRect();
      JOY.bx=t.clientX; JOY.by=t.clientY;
      JOY.kx=t.clientX; JOY.ky=t.clientY;
      JOY.dx=0; JOY.dy=0;
      setJoyVis(true, t.clientX-z.left, t.clientY-z.top);
    }
  }
},{passive:false});

document.getElementById('joy-zone').addEventListener('touchmove',e=>{
  e.preventDefault();
  const z=document.getElementById('joy-zone').getBoundingClientRect();
  for(const t of e.changedTouches){
    if(t.identifier===JOY.id){
      const dx=t.clientX-JOY.bx, dy=t.clientY-JOY.by;
      const dist=Math.hypot(dx,dy);
      const clamped=Math.min(dist,JOY.R);
      const angle=Math.atan2(dy,dx);
      JOY.dx=(clamped/JOY.R)*Math.cos(angle);
      JOY.dy=(clamped/JOY.R)*Math.sin(angle);
      const kx=JOY.bx-z.left+Math.cos(angle)*clamped;
      const ky=JOY.by-z.top+Math.sin(angle)*clamped;
      const b=joyBase(),k=joyKnob();
      k.style.left=(kx-b.offsetLeft+b.offsetWidth/2)+'px';
      k.style.top=(ky-b.offsetTop+b.offsetHeight/2)+'px';
    }
  }
},{passive:false});

function joyEnd(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===JOY.id){
      JOY.active=false; JOY.id=null;
      JOY.dx=0; JOY.dy=0;
      setJoyVis(false);
    }
  }
}
document.getElementById('joy-zone').addEventListener('touchend',joyEnd,{passive:false});
document.getElementById('joy-zone').addEventListener('touchcancel',joyEnd,{passive:false});

// Pinch zoom
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===2 && gs===ST.SPACE){
    PINCH.active=true;
    PINCH.d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===2 && PINCH.active && gs===ST.SPACE){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    cam.zoom=Math.max(0.1,Math.min(5,cam.zoom*(d/PINCH.d)));
    PINCH.d=d;
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{if(e.touches.length<2)PINCH.active=false;},{passive:false});

// Buttons
function holdBtn(el,onStart,onEnd){
  el.addEventListener('touchstart',e=>{e.preventDefault();onStart();},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();onEnd();},{passive:false});
  el.addEventListener('touchcancel',e=>{e.preventDefault();onEnd();},{passive:false});
  el.addEventListener('mousedown',onStart);
  el.addEventListener('mouseup',onEnd);
  el.addEventListener('mouseleave',onEnd);
}
holdBtn(document.getElementById('btn-boost'),()=>touchBoost=true,()=>touchBoost=false);

document.getElementById('btn-action').addEventListener('touchstart',e=>{
  e.preventDefault(); touchAction=true;
  setTimeout(()=>{touchAction=false;},200);
  handleE();
},{passive:false});
document.getElementById('btn-action').addEventListener('mousedown',()=>{handleE();});

let ziHeld=false,zoHeld=false;
holdBtn(document.getElementById('btn-zi'),()=>ziHeld=true,()=>ziHeld=false);
holdBtn(document.getElementById('btn-zo'),()=>zoHeld=true,()=>zoHeld=false);

// ── Keyboard ───────────────────────────────────────────────────────────────
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='e'||e.key==='E')handleE();if(e.key===' ')e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.key]=false;});
window.addEventListener('wheel',e=>{
  if(gs===ST.SPACE)cam.zoom=Math.max(0.1,Math.min(5,cam.zoom*(e.deltaY>0?.9:1.1)));
  e.preventDefault();
},{passive:false});

function handleE(){
  if(gs===ST.TRANS)return;
  if(gs===ST.SPACE&&nearPlanet)enterPlanet(nearPlanet);
  else if(gs===ST.PLANET)exitPlanet();
}

function isKey(...k){return k.some(x=>keys[x]);}

// ── Sectors ────────────────────────────────────────────────────────────────
const SEC=8000;
const cache=new Map();
function getSec(sx,sy){const k=`${sx},${sy}`;if(!cache.has(k))cache.set(k,genSec(sx,sy));return cache.get(k);}

function genSec(sx,sy){
  const r=srng(h2(sx,sy));
  const objs=[];
  // Stars
  for(let i=0;i<50;i++) objs.push({type:'star',x:sx*SEC+r()*SEC,y:sy*SEC+r()*SEC,sz:.5+r()*2,br:.3+r()*.7,col:sCl(r)});
  // Nebula
  if(r()<.35){const h=r()*360;for(let i=0;i<4;i++) objs.push({type:'neb',x:sx*SEC+r()*SEC,y:sy*SEC+r()*SEC,rx:400+r()*900,ry:300+r()*600,h,a:.04+r()*.07});}
  // Planets
  const pc=1+Math.floor(r()*4);
  for(let i=0;i<pc;i++){
    const px=sx*SEC+700+r()*(SEC-1400), py=sy*SEC+700+r()*(SEC-1400);
    objs.push(makePl(px,py,h2(Math.floor(px),Math.floor(py)),r));
  }
  // Black hole
  if(r()<.09) objs.push({type:'bh',x:sx*SEC+r()*SEC,y:sy*SEC+r()*SEC,r:80+r()*90,col:`hsl(${30+r()*40},100%,60%)`});
  // Asteroids
  if(r()<.5){const n=5+Math.floor(r()*12),ax=sx*SEC+r()*SEC,ay=sy*SEC+r()*SEC;
    for(let i=0;i<n;i++) objs.push({type:'ast',x:ax+(r()-.5)*700,y:ay+(r()-.5)*700,sz:8+r()*30,rot:r()*Math.PI*2,rs:(r()-.5)*.015,sides:5+Math.floor(r()*4),col:`hsl(${20+r()*20},${10+r()*20}%,${40+r()*20}%)`});}
  return objs;
}

function sCl(r){const v=r();return v<.6?'#fff':v<.75?'#adf':v<.85?'#fda':v<.92?'#faa':'#aaf';}

const BIOMES=[
  {name:'翠綠星球',col:'#2d8a2d',atm:'rgba(60,200,60,0.22)',sky:'#071507',gnd:'#1a5a1a',grass:'#3aaa3a'},
  {name:'沙漠星球',col:'#c8882a',atm:'rgba(200,140,50,0.28)',sky:'#1a0e00',gnd:'#8a5a10',grass:'#c8a040'},
  {name:'冰雪星球',col:'#aae0ff',atm:'rgba(150,220,255,0.28)',sky:'#040818',gnd:'#b0d8f8',grass:'#d0f0ff'},
  {name:'熔岩星球',col:'#cc2200',atm:'rgba(255,60,0,0.28)',sky:'#100000',gnd:'#3a0800',grass:'#ff4400'},
  {name:'毒素星球',col:'#88ff44',atm:'rgba(100,255,50,0.22)',sky:'#001300',gnd:'#1a3a00',grass:'#88ff44'},
  {name:'海洋星球',col:'#0088cc',atm:'rgba(0,150,255,0.28)',sky:'#000818',gnd:'#002244',grass:'#00aaff'},
  {name:'晶體星球',col:'#cc44ff',atm:'rgba(180,60,255,0.22)',sky:'#080018',gnd:'#1a0040',grass:'#cc88ff'},
  {name:'荒蕪星球',col:'#888888',atm:'rgba(120,120,120,0.12)',sky:'#040404',gnd:'#444444',grass:'#666666'},
];

const SYL=['nor','man','sky','ara','kel','zen','vox','nar','lys','tal','el','os','ix','um','an','ia','or','us'];
function plName(seed){const r=srng(seed);let n='';for(let i=0;i<2+Math.floor(r()*2);i++){const s=SYL[Math.floor(r()*SYL.length)];n+=i?s:s[0].toUpperCase()+s.slice(1);}return n;}

function makePl(px,py,seed,r){
  const bi=BIOMES[Math.floor(r()*BIOMES.length)];
  return{type:'planet',x:px,y:py,r:60+r()*120,seed,bi,name:plName(seed),
    ring:r()<.3,rTilt:r()*.5,moon:r()<.4,mDist:0,mR:8+r()*20,mA:r()*Math.PI*2,mS:.002+r()*.003,
    clouds:Math.floor(r()*8),rspd:(r()-.5)*.002};
}

// ── Surface Gen ────────────────────────────────────────────────────────────
const SW=6000, SH=800;

function genSurface(planet){
  const r=srng(planet.seed), bi=planet.bi;
  const layers=[{a:110,f:.003,p:r()*6},{a:55,f:.008,p:r()*6},{a:28,f:.02,p:r()*6},{a:11,f:.05,p:r()*6}];
  const baseY=SH*.6, terr=[];
  for(let x=0;x<SW;x+=4){let y=baseY;for(const l of layers)y-=l.a*Math.sin(x*l.f+l.p);terr.push({x,y});}

  const flora=[];
  for(let i=0;i<60+Math.floor(r()*60);i++){
    const fx=r()*SW, ti=Math.floor(fx/4);
    flora.push({x:fx,y:terr[Math.min(ti,terr.length-1)].y,type:Math.floor(r()*4),sz:20+r()*50,col:bi.grass});
  }
  const rocks=[];
  for(let i=0;i<25;i++){
    const fx=r()*SW,ti=Math.floor(fx/4);
    rocks.push({x:fx,y:terr[Math.min(ti,terr.length-1)].y,sz:12+r()*32});
  }
  const crts=[];
  for(let i=0;i<6+Math.floor(r()*7);i++){
    const fx=r()*SW,ti=Math.floor(fx/4);
    crts.push({x:fx,y:terr[Math.min(ti,terr.length-1)].y,vx:(r()-.5)*1.5,sz:14+r()*24,
      col:`hsl(${r()*360},${50+r()*50}%,${40+r()*30}%)`,lp:r()*Math.PI*2,type:Math.floor(r()*3)});
  }
  const sky=[];
  for(let i=0;i<120;i++) sky.push({x:r()*SW,y:r()*SH*.5,sz:r()*2,br:r()});

  planet.mDist=planet.r*2+50+r()*planet.r;
  return{planet,terr,flora,rocks,crts,sky,bi,baseY,grav:.3};
}

function terrY(s,wx){
  const t=s.terr,i=Math.floor(wx/4);
  if(i<=0)return t[0].y;
  if(i>=t.length-1)return t[t.length-1].y;
  return t[i].y+(t[i+1].y-t[i].y)*((wx%4)/4);
}

// ── Color helpers ──────────────────────────────────────────────────────────
function lc(h,a){try{const r=Math.min(255,Math.max(0,parseInt(h.slice(1,3),16)+a)),g=Math.min(255,Math.max(0,parseInt(h.slice(3,5),16)+a)),b=Math.min(255,Math.max(0,parseInt(h.slice(5,7),16)+a));return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;}catch(e){return h;}}
function dk(h,a){return lc(h,-a);}

// ── Draw Space ─────────────────────────────────────────────────────────────
function drawSpace(){
  ctx.fillStyle='#00000c';
  ctx.fillRect(0,0,W,H);

  const visW=W/cam.zoom, visH=H/cam.zoom;
  const x0=cam.x-visW/2, y0=cam.y-visH/2;

  // Parallax stars
  for(let lay=0;lay<3;lay++){
    const par=.2+lay*.3, sp=120-lay*30;
    const startX=Math.floor(x0*par/sp)*sp, startY=Math.floor(y0*par/sp)*sp;
    for(let px=startX;px<x0*par+visW;px+=sp){
      for(let py=startY;py<y0*par+visH;py+=sp){
        const rr=srng(h2(Math.floor(px/sp)*73,Math.floor(py/sp)*37+lay*999));
        const wx=px/par-x0*par/par+x0, wy=py/par-y0*par/par+y0;
        const sx=(wx-x0)*cam.zoom, sy=(wy-y0)*cam.zoom;
        if(sx<-4||sx>W+4||sy<-4||sy>H+4)continue;
        ctx.globalAlpha=(0.3+rr()*.7)*(0.7+0.3*Math.sin(time*.05+rr()*10));
        ctx.fillStyle=sCl(rr);
        ctx.beginPath(); ctx.arc(sx,sy,(0.5+rr()*(1+lay))*cam.zoom,0,Math.PI*2); ctx.fill();
      }
    }
  }
  ctx.globalAlpha=1;

  // Sector objects
  const sx0=Math.floor(x0/SEC)-1, sy0=Math.floor(y0/SEC)-1;
  const sx1=Math.floor((x0+visW)/SEC)+1, sy1=Math.floor((y0+visH)/SEC)+1;
  const all=[];
  for(let sx=sx0;sx<=sx1;sx++) for(let sy=sy0;sy<=sy1;sy++) all.push(...getSec(sx,sy));
  all.sort((a,b)=>({neb:0,star:1,ast:2,planet:3,bh:4}[a.type]||0)-({neb:0,star:1,ast:2,planet:3,bh:4}[b.type]||0));

  for(const o of all){
    const sx2=(o.x-x0)*cam.zoom, sy2=(o.y-y0)*cam.zoom;
    if(o.type==='neb') drawNeb(o,sx2,sy2);
    else if(o.type==='star'){if(sx2>-5&&sx2<W+5&&sy2>-5&&sy2<H+5){ctx.globalAlpha=o.br*(0.8+0.2*Math.sin(time*.03+o.x*.01));ctx.fillStyle=o.col;ctx.beginPath();ctx.arc(sx2,sy2,o.sz*cam.zoom,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}}
    else if(o.type==='ast'){o.rot+=o.rs;drawAst(o,sx2,sy2);}
    else if(o.type==='planet'){o.mA+=o.mS;drawPlanet(o,sx2,sy2);}
    else if(o.type==='bh') drawBH(o,sx2,sy2);
  }
  drawShip(W/2,H/2,pl.angle);
}

function drawNeb(o,sx,sy){
  const rx=o.rx*cam.zoom, ry=o.ry*cam.zoom;
  if(sx+rx<0||sx-rx>W||sy+ry<0||sy-ry>H)return;
  ctx.save(); ctx.scale(1,ry/rx);
  const g=ctx.createRadialGradient(sx,sy*rx/ry,0,sx,sy*rx/ry,rx);
  g.addColorStop(0,`hsla(${o.h},80%,60%,${o.a*2})`);
  g.addColorStop(.5,`hsla(${o.h},70%,40%,${o.a})`);
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy*rx/ry,rx,0,Math.PI*2); ctx.fill(); ctx.restore();
}

function drawAst(o,sx,sy){
  const r=o.sz*cam.zoom; if(sx+r<0||sx-r>W||sy+r<0||sy-r>H)return;
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(o.rot); ctx.beginPath();
  for(let i=0;i<o.sides;i++){const a=i/o.sides*Math.PI*2,j=.7+.3*Math.sin(i*1.618);ctx.lineTo(Math.cos(a)*r*j,Math.sin(a)*r*j);}
  ctx.closePath(); ctx.fillStyle=o.col; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=.5; ctx.stroke(); ctx.restore();
}

function drawPlanet(o,sx,sy){
  const r=o.r*cam.zoom; if(sx+r*3.5<0||sx-r*3.5>W||sy+r*3.5<0||sy-r*3.5>H)return;

  if(o.ring){
    ctx.save(); ctx.scale(1,o.rTilt+.1);
    ctx.beginPath(); ctx.arc(sx,sy/(o.rTilt+.1),r*2.2,0,Math.PI,true);
    const rg=ctx.createLinearGradient(sx-r*2.2,0,sx+r*2.2,0);
    rg.addColorStop(0,'transparent'); rg.addColorStop(.25,o.bi.col+'88');
    rg.addColorStop(.75,o.bi.col+'44'); rg.addColorStop(1,'transparent');
    ctx.lineWidth=r*.38; ctx.strokeStyle=rg; ctx.stroke(); ctx.restore();
  }

  const ag=ctx.createRadialGradient(sx,sy,r*.9,sx,sy,r*1.55);
  ag.addColorStop(0,o.bi.atm); ag.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(sx,sy,r*1.55,0,Math.PI*2); ctx.fillStyle=ag; ctx.fill();

  const bg=ctx.createRadialGradient(sx-r*.3,sy-r*.3,r*.1,sx,sy,r);
  bg.addColorStop(0,lc(o.bi.col,60)); bg.addColorStop(.5,o.bi.col); bg.addColorStop(1,dk(o.bi.col,60));
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();

  ctx.save(); ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.clip();
  const co=(time*o.rspd*30+r)%(r*2);
  for(let i=0;i<o.clouds;i++){
    const rr=srng(o.seed+i*100),cx2=sx-r+(rr()*r*2+co)%(r*2),cy2=sy-r*.5+rr()*r*1.2,cr=r*(.2+rr()*.25);
    ctx.globalAlpha=.12+rr()*.15; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(cx2,cy2,cr,cr*.45,0,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=.5;
  const sh=ctx.createRadialGradient(sx+r*.5,sy,0,sx+r*.5,sy,r*1.5);
  sh.addColorStop(0,'rgba(0,0,20,.85)'); sh.addColorStop(.5,'rgba(0,0,20,.4)'); sh.addColorStop(1,'transparent');
  ctx.fillStyle=sh; ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1; ctx.restore();

  if(o.ring){
    ctx.save(); ctx.scale(1,o.rTilt+.1);
    ctx.beginPath(); ctx.arc(sx,sy/(o.rTilt+.1),r*2.2,0,Math.PI,false);
    const rg=ctx.createLinearGradient(sx-r*2.2,0,sx+r*2.2,0);
    rg.addColorStop(0,'transparent'); rg.addColorStop(.25,o.bi.col+'88');
    rg.addColorStop(.75,o.bi.col+'44'); rg.addColorStop(1,'transparent');
    ctx.lineWidth=r*.38; ctx.strokeStyle=rg; ctx.stroke(); ctx.restore();
  }

  if(o.moon){
    const mx=sx+Math.cos(o.mA)*o.mDist*cam.zoom, my=sy+Math.sin(o.mA)*o.mDist*cam.zoom*.4, mr=o.mR*cam.zoom;
    const mg=ctx.createRadialGradient(mx-mr*.3,my-mr*.3,0,mx,my,mr);
    mg.addColorStop(0,'#ccc'); mg.addColorStop(1,'#555');
    ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fillStyle=mg; ctx.fill();
  }

  if(r>14){
    ctx.textAlign='center'; ctx.font=`${Math.min(r*.3,13)}px Courier New`;
    ctx.fillStyle=discovered.has(o.seed)?'#fa0':'rgba(180,230,255,.55)';
    ctx.fillText(discovered.has(o.seed)?o.name:'???',sx,sy+r+14);
  }

  const dist=Math.hypot(pl.x-o.x,pl.y-o.y), lr=o.r*1.8;
  if(dist<lr*2&&dist>o.r){
    ctx.beginPath(); ctx.arc(sx,sy,lr*cam.zoom,0,Math.PI*2);
    ctx.strokeStyle=`rgba(0,255,200,${.25+.2*Math.sin(time*.1)})`; ctx.lineWidth=1;
    ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]);
  }
}

function drawBH(o,sx,sy){
  const r=o.r*cam.zoom; if(sx+r*5<0||sx-r*5>W||sy+r*5<0||sy-r*5>H)return;
  for(let i=3;i>0;i--){ctx.beginPath();ctx.arc(sx,sy,r*(1+i*.6),0,Math.PI*2);ctx.strokeStyle=`rgba(255,200,100,${.04*i})`;ctx.lineWidth=r*.3*i;ctx.stroke();}
  ctx.save(); ctx.scale(1,.25);

    ctx.beginPath(); ctx.arc(sx,sy*4,r*(1.3+i*.15),time*.02+i,time*.02+Math.PI+i);
    ctx.strokeStyle=`hsl(${30+i*15},100%,${60-i*10}%)`;
    ctx.lineWidth=r*(.12-i*.02); ctx.globalAlpha=.8-i*.15; ctx.stroke();
  }
  ctx.globalAlpha=1; ctx.restore();
  const bg=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
  bg.addColorStop(0,'#000'); bg.addColorStop(.75,'#000'); bg.addColorStop(.9,'rgba(20,0,50,.7)'); bg.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();

}

function drawShip(sx,sy,angle){

// ── Draw Surface ────────────────────────────────────────────────────────────
function drawSurface(){
  const s=surface, camX=pl.sx-W/2, tOY=H*.06;
  const skyG=ctx.createLinearGradient(0,0,0,H);
  skyG.addColorStop(0,s.bi.sky); skyG.addColorStop(.65,s.bi.atm.replace(/[\d.]+\)$/,'.08)')); skyG.addColorStop(1,s.bi.gnd);
  ctx.fillStyle=skyG; ctx.fillRect(0,0,W,H);

  for(const st of s.sky){
    const sx2=st.x-camX; if(sx2<-2||sx2>W+2)continue;
    ctx.globalAlpha=st.br*(0.5+0.5*Math.sin(time*.04+st.x*.1));
    ctx.fillStyle='#fff'; ctx.fillRect(sx2,st.y*(H/SH),st.sz,st.sz);
  }
  ctx.globalAlpha=1;

  // Sun
  const sG=ctx.createRadialGradient(90,70,0,90,70,55); sG.addColorStop(0,'#fff'); sG.addColorStop(.4,'#ffe070'); sG.addColorStop(1,'transparent');
  ctx.fillStyle=sG; ctx.beginPath(); ctx.arc(90,70,55,0,Math.PI*2); ctx.fill();

  // Terrain
  ctx.beginPath(); ctx.moveTo(-5,H+5);
  for(const pt of s.terr){const sx2=pt.x-camX;ctx.lineTo(sx2,pt.y*(H/SH)+tOY);}
  ctx.lineTo(SW-camX,H+5); ctx.closePath();
  const tg=ctx.createLinearGradient(0,H*.35,0,H);
  tg.addColorStop(0,s.bi.grass); tg.addColorStop(.25,s.bi.gnd); tg.addColorStop(1,dk(s.bi.gnd,40));
  ctx.fillStyle=tg; ctx.fill();
  ctx.strokeStyle=lc(s.bi.grass,20); ctx.lineWidth=2; ctx.stroke();

  for(const rk of s.rocks){const rx=rk.x-camX;if(rx<-80||rx>W+80)continue;const ry=rk.y*(H/SH)+tOY;ctx.beginPath();ctx.ellipse(rx,ry,rk.sz*.8,rk.sz*.45,0,Math.PI,0);ctx.fillStyle=lc(s.bi.gnd,15);ctx.fill();}
  for(const f of s.flora){const fx=f.x-camX;if(fx<-100||fx>W+100)continue;drawFlora(f,fx,f.y*(H/SH)+tOY);}
  for(const c of s.crts){
    c.x+=c.vx; c.lp+=.08; c.y=terrY(s,c.x);
    if(c.x<0||c.x>SW)c.vx*=-1;
    const cx2=c.x-camX;if(cx2<-80||cx2>W+80)continue;
    drawCreature(c,cx2,c.y*(H/SH)+tOY);
  }

  drawSurfacePl(W/2,pl.sy*(H/SH)+tOY);

  const at=ctx.createLinearGradient(0,0,0,H*.28);
  at.addColorStop(0,s.bi.atm); at.addColorStop(1,'transparent');
  ctx.fillStyle=at; ctx.fillRect(0,0,W,H*.28);
}

function drawFlora(f,fx,fy){
  const sz=f.sz;
  switch(f.type){
    case 0:
      ctx.fillStyle=dk(f.col,30); ctx.fillRect(fx-sz*.08,fy-sz,sz*.16,sz);
      ctx.beginPath(); ctx.moveTo(fx,fy-sz*1.6); ctx.lineTo(fx-sz*.5,fy-sz*.8); ctx.lineTo(fx+sz*.5,fy-sz*.8); ctx.closePath(); ctx.fillStyle=f.col; ctx.fill();
      ctx.beginPath(); ctx.moveTo(fx,fy-sz*2.05); ctx.lineTo(fx-sz*.35,fy-sz*1.3); ctx.lineTo(fx+sz*.35,fy-sz*1.3); ctx.closePath(); ctx.fill();
      break;
    case 1:
      for(let i=0;i<3;i++){
        const a=i*Math.PI*2/3+fx*.01, len=sz*(.6+i*.3);
        ctx.beginPath(); ctx.moveTo(fx+Math.cos(a)*sz*.18,fy); ctx.lineTo(fx+Math.cos(a)*sz*.05,fy-len); ctx.lineTo(fx+Math.cos(a+.3)*sz*.05,fy-len); ctx.lineTo(fx+Math.cos(a+.15)*sz*.18,fy);
        ctx.closePath(); ctx.fillStyle=f.col+'cc'; ctx.fill();
        ctx.strokeStyle=lc(f.col,60); ctx.lineWidth=.5; ctx.stroke();
      }
      break;
    case 2:
      ctx.fillStyle=dk(f.col,10); ctx.fillRect(fx-sz*.06,fy-sz*.7,sz*.12,sz*.7);
      ctx.beginPath(); ctx.ellipse(fx,fy-sz*.7,sz*.44,sz*.34,0,Math.PI,0); ctx.fillStyle=f.col; ctx.fill();
      for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(fx-sz*.28+i*sz*.19,fy-sz*.75,sz*.05,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.6)';ctx.fill();}
      break;
    case 3:
      for(let i=0;i<5;i++){
        const a=i/5*Math.PI*2, len=sz*(.5+Math.sin(i*1.618)*.3);
        ctx.beginPath(); ctx.moveTo(fx,fy); ctx.quadraticCurveTo(fx+Math.cos(a)*len*.5,fy-len*.5,fx+Math.cos(a)*len*.3,fy-len);
        ctx.strokeStyle=f.col; ctx.lineWidth=2; ctx.stroke();
        ctx.beginPath(); ctx.arc(fx+Math.cos(a)*len*.3,fy-len,sz*.09,0,Math.PI*2); ctx.fillStyle=lc(f.col,40); ctx.fill();
      }
      break;
  }
}

function drawCreature(c,cx2,cy2){
  const sz=c.sz;
  ctx.save(); ctx.translate(cx2,cy2); if(c.vx>0)ctx.scale(-1,1);
  switch(c.type){
    case 0:
      ctx.fillStyle=c.col; ctx.beginPath(); ctx.ellipse(-sz*.1,-sz*.4,sz*.4,sz*.2,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-sz*.45,-sz*.45,sz*.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-sz*.5,-sz*.5,sz*.07,0,Math.PI*2); ctx.fill();
      for(let i=0;i<4;i++){const ph=c.lp+i*Math.PI/2;ctx.beginPath();ctx.moveTo(-sz*.3+i*sz*.2,-sz*.25);ctx.lineTo(-sz*.3+i*sz*.2,Math.sin(ph)*sz*.15);ctx.strokeStyle=c.col;ctx.lineWidth=2;ctx.stroke();}
      break;
    case 1:
      ctx.save(); ctx.translate(0,Math.sin(time*.05+c.x*.01)*5-sz*.5);
      ctx.beginPath(); ctx.ellipse(0,0,sz*.5,sz*.3,0,0,Math.PI*2); ctx.fillStyle=c.col; ctx.fill();
      for(let i=0;i<5;i++){const tx=-sz*.4+i*sz*.2;ctx.beginPath();ctx.moveTo(tx,sz*.28);ctx.quadraticCurveTo(tx+Math.sin(c.lp+i)*8,sz*.55,tx,sz*.75);ctx.strokeStyle=c.col;ctx.lineWidth=2;ctx.stroke();}
      ctx.restore(); break;
    case 2:
      ctx.fillStyle=c.col; ctx.beginPath(); ctx.ellipse(0,-sz*.5,sz*.2,sz*.35,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-sz*.9,sz*.18,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-sz*.05,-sz*.2); ctx.lineTo(-sz*.15,sz*.15+Math.sin(c.lp)*sz*.1); ctx.strokeStyle=c.col; ctx.lineWidth=3; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sz*.05,-sz*.2); ctx.lineTo(sz*.15,sz*.15+Math.sin(c.lp+Math.PI)*sz*.1); ctx.stroke();
      break;
  }
  ctx.restore();
}

function drawSurfacePl(px,py){
  ctx.save(); ctx.translate(px,py);
  if(!pl.grounded){const eg=ctx.createRadialGradient(0,10,0,0,10,16);eg.addColorStop(0,'rgba(0,200,255,.85)');eg.addColorStop(1,'transparent');ctx.fillStyle=eg;ctx.beginPath();ctx.arc(0,10,16,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#4af'; ctx.beginPath(); ctx.roundRect(-8,-25,16,20,4); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-25,10,0,Math.PI*2); ctx.fillStyle='#2af'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,-25,7,0,Math.PI*2); ctx.fillStyle='rgba(0,200,255,.5)'; ctx.fill();
  const run=isKey('ArrowLeft','ArrowRight','a','d','A','D')||Math.abs(JOY.dx)>.2;

  ctx.restore();
}

// ── Update Space ──────────────────────────────────────────────────────────
function updateSpace(){
  const boost=(isKey('Shift')||touchBoost)?3:1;
  const accel=.14*boost, maxSpd=11*boost;

  // Zoom buttons
  if(ziHeld)cam.zoom=Math.min(5,cam.zoom*1.02);
  if(zoHeld)cam.zoom=Math.max(.1,cam.zoom*.98);

  // Rotate
  if(isKey('ArrowLeft','a','A')||JOY.dx<-.25) pl.angle-=.05*(1+Math.abs(JOY.dx<-.25?JOY.dx:0));
  if(isKey('ArrowRight','d','D')||JOY.dx>.25)  pl.angle+=.05*(1+Math.abs(JOY.dx>.25?JOY.dx:0));

  // Thrust
  if(isKey('ArrowUp','w','W')||JOY.dy<-.3){
    pl.vx+=Math.cos(pl.angle)*accel; pl.vy+=Math.sin(pl.angle)*accel;
    pl.fuel=Math.max(0,pl.fuel-.02*boost);
  }
  if(isKey('ArrowDown','s','S')||JOY.dy>.3){
    pl.vx-=Math.cos(pl.angle)*accel*.5; pl.vy-=Math.sin(pl.angle)*accel*.5;
  }

  pl.vx*=.98; pl.vy*=.98;
  const spd=Math.hypot(pl.vx,pl.vy);
  if(spd>maxSpd){pl.vx=pl.vx/spd*maxSpd;pl.vy=pl.vy/spd*maxSpd;}
  pl.x+=pl.vx; pl.y+=pl.vy; pl.speed=Math.round(spd*10)/10;

  // Black hole gravity
  const x0=cam.x-W/(2*cam.zoom), y0=cam.y-H/(2*cam.zoom);
  const sx0=Math.floor(x0/SEC)-1,sy0=Math.floor(y0/SEC)-1;
  const sx1=Math.floor((x0+W/cam.zoom)/SEC)+1,sy1=Math.floor((y0+H/cam.zoom)/SEC)+1;
  for(let sx=sx0;sx<=sx1;sx++) for(let sy=sy0;sy<=sy1;sy++)
    for(const o of getSec(sx,sy)) if(o.type==='bh'){
      const dx=o.x-pl.x,dy=o.y-pl.y,d=Math.hypot(dx,dy);
      if(d<o.r*15){const f=5000/(d*d);pl.vx+=dx/d*f;pl.vy+=dy/d*f;if(d<o.r*1.5)camShake=20;}
    }

  cam.x+=(pl.x-cam.x)*.1; cam.y+=(pl.y-cam.y)*.1;
  if(pl.fuel<100)pl.fuel=Math.min(100,pl.fuel+.01);

  // Nearby planet
  nearPlanet=null;
  for(let sx=sx0-1;sx<=sx1+1;sx++) for(let sy=sy0-1;sy<=sy1+1;sy++)
    for(const o of getSec(sx,sy)) if(o.type==='planet'){
      if(Math.hypot(pl.x-o.x,pl.y-o.y)<o.r*1.8){nearPlanet=o;discovered.add(o.seed);}
    }
}

function updatePlanet(){
  const mv=3;
  if(isKey('ArrowLeft','a','A')||JOY.dx<-.2) pl.svx=-mv*(JOY.active?Math.abs(JOY.dx)*1.5+.5:1);
  else if(isKey('ArrowRight','d','D')||JOY.dx>.2) pl.svx=mv*(JOY.active?Math.abs(JOY.dx)*1.5+.5:1);
  else pl.svx*=.8;

  const jump=isKey('ArrowUp','w','W',' ')||JOY.dy<-.5;
  if(jump&&pl.grounded){pl.svy=-7;pl.grounded=false;}

  pl.svy+=surface.grav;
  pl.sx+=pl.svx; pl.sy+=pl.svy;
  pl.sx=Math.max(10,Math.min(SW-10,pl.sx));
  const gy=terrY(surface,pl.sx);
  if(pl.sy>=gy-30){pl.sy=gy-30;pl.svy=0;pl.grounded=true;}else pl.grounded=false;
}

// ── Transitions ────────────────────────────────────────────────────────────
function enterPlanet(planet){
  if(gs!==ST.SPACE)return;
  gs=ST.TRANS;
  const fd=document.getElementById('fade');
  fd.style.opacity=1;
  setTimeout(()=>{
    surface=genSurface(planet);
    pl.sx=SW/2; pl.sy=surface.baseY-80; pl.svx=0; pl.svy=0; pl.grounded=false;
    gs=ST.PLANET;
    const pm=document.getElementById('p-mid');
    pm.style.display='block'; pm.textContent=`${planet.name} — ${planet.bi.name}`;
    fd.style.opacity=0;
  },700);
}

function exitPlanet(){
  if(gs!==ST.PLANET)return;
  gs=ST.TRANS;
  const fd=document.getElementById('fade');
  fd.style.opacity=1;
  setTimeout(()=>{gs=ST.SPACE;document.getElementById('p-mid').style.display='none';fd.style.opacity=0;},600);
}

}

function drawMinimap(){
  mctx.clearRect(0,0,110,110);
  mctx.fillStyle='rgba(0,5,15,.9)';mctx.fillRect(0,0,110,110);
  const cx=55,cy=55,sc=.004;
  if(gs===ST.SPACE){
    const r10=10000;
    const sx0=Math.floor((pl.x-r10)/SEC)-1,sy0=Math.floor((pl.y-r10)/SEC)-1;
    const sx1=Math.floor((pl.x+r10)/SEC)+1,sy1=Math.floor((pl.y+r10)/SEC)+1;
    for(let sx=sx0;sx<=sx1;sx++) for(let sy=sy0;sy<=sy1;sy++)
      for(const o of getSec(sx,sy)){
        const mx=cx+(o.x-pl.x)*sc,my=cy+(o.y-pl.y)*sc;
        if(mx<4||mx>106||my<4||my>106)continue;
        if(o.type==='planet'){mctx.beginPath();mctx.arc(mx,my,Math.max(2,o.r*sc*8),0,Math.PI*2);mctx.fillStyle=discovered.has(o.seed)?'#fa0':o.bi.col;mctx.fill();}
        else if(o.type==='bh'){mctx.beginPath();mctx.arc(mx,my,4,0,Math.PI*2);mctx.fillStyle='#f80';mctx.fill();}
      }
    mctx.fillStyle='#0ff';mctx.beginPath();mctx.arc(cx,cy,3,0,Math.PI*2);mctx.fill();
  } else if(surface){
    mctx.fillStyle=surface.bi.gnd;mctx.fillRect(5,55,100,40);
    const px=5+(pl.sx/SW)*100;
    mctx.fillStyle='#0ff';mctx.fillRect(px-2,50,4,8);
  }
  mctx.beginPath();mctx.arc(55,55,54,0,Math.PI*2);mctx.strokeStyle='rgba(0,255,200,.3)';mctx.lineWidth=1;mctx.stroke();
}

// ── Main Loop ──────────────────────────────────────────────────────────────
function loop(){
  time++;
  if(camShake>0){camShake*=.88;ctx.save();ctx.translate((Math.random()-.5)*camShake,(Math.random()-.5)*camShake);}
  if(gs===ST.SPACE||gs===ST.TRANS){if(gs===ST.SPACE)updateSpace();drawSpace();}
  else if(gs===ST.PLANET){updatePlanet();drawSurface();}
  if(camShake>0)ctx.restore();
  drawJoyOverlay();
  updateHUD(); drawMinimap();
  requestAnimationFrame(loop);
}

window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;});
document.addEventListener('contextmenu',e=>e.preventDefault());

requestAnimationFrame(loop);
</script>
