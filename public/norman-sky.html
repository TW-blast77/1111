<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Norman Sky 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;}
canvas{display:block;}
#c3d{position:fixed;top:0;left:0;touch-action:none;}

#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10;font:'Courier New',monospace;}
.panel{position:absolute;background:rgba(0,12,28,0.78);border:1px solid rgba(0,255,255,0.22);
  border-radius:8px;padding:6px 10px;font:11px/1.6 'Courier New',monospace;color:#7df;backdrop-filter:blur(6px);}
#p-tl{top:10px;left:10px;min-width:150px;}
#p-tr{top:10px;right:10px;text-align:right;}
#p-bc{bottom:170px;left:50%;transform:translateX(-50%);display:none;font-size:14px;color:#fa0;white-space:nowrap;}
.lbl{font-size:9px;color:rgba(100,200,255,0.5);margin-top:2px;}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,0.1);margin:1px 0;}
.brf{height:5px;border-radius:3px;background:linear-gradient(90deg,#0af,#07f);}
.brs{height:5px;border-radius:3px;background:linear-gradient(90deg,#0f8,#090);}

#minimap{position:fixed;right:10px;bottom:160px;width:110px;height:110px;
  border:1px solid rgba(0,255,255,0.25);border-radius:50%;z-index:15;pointer-events:none;
  background:rgba(0,5,15,.85);}

#prompt{position:fixed;bottom:175px;left:50%;transform:translateX(-50%);
  background:rgba(0,255,180,0.13);border:1px solid rgba(0,255,180,0.45);
  color:#0fc;padding:7px 18px;border-radius:20px;font:13px 'Courier New',monospace;
  z-index:20;pointer-events:none;display:none;animation:blink 1.1s infinite;white-space:nowrap;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

#touch-ui{position:fixed;bottom:0;left:0;right:0;height:160px;z-index:30;pointer-events:none;}
#joy-zone{position:absolute;left:0;bottom:0;width:50%;height:100%;pointer-events:auto;}
#joy-base{position:absolute;width:100px;height:100px;border-radius:50%;
  background:rgba(0,200,255,.07);border:2px solid rgba(0,200,255,.28);display:none;transform:translate(-50%,-50%);}
#joy-knob{position:absolute;width:44px;height:44px;border-radius:50%;
  background:rgba(0,200,255,.45);border:2px solid rgba(0,255,255,.75);transform:translate(-50%,-50%);top:50%;left:50%;}
#btn-area{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:auto;}
.btn{width:58px;height:58px;border-radius:50%;border:2px solid rgba(0,255,200,.55);
  background:rgba(0,25,45,.72);color:#0fc;font:bold 11px 'Courier New',monospace;
  cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;
  line-height:1.2;user-select:none;-webkit-user-select:none;pointer-events:auto;backdrop-filter:blur(4px);}
.btn:active,.btn.on{background:rgba(0,200,150,.33);border-color:#0ff;}
#btn-e{width:68px;height:68px;font-size:19px;}
#btn-b{width:50px;height:50px;font-size:10px;border-color:rgba(255,200,0,.5);color:#fa0;}
#zrow{display:flex;gap:8px;}
#bzi,#bzo{width:43px;height:43px;font-size:19px;font-weight:bold;}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:100;transition:opacity .7s;}
#hint{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);
  color:rgba(0,180,255,.3);font:10px 'Courier New',monospace;pointer-events:none;z-index:20;white-space:nowrap;}
</style>
</head>
<body>
<canvas id="c3d"></canvas>

<div id="hud">
  <div class="panel" id="p-tl">
    <div style="font-size:12px;color:#0ff;letter-spacing:2px;margin-bottom:3px">◈ NAVIGATOR</div>
    <div class="lbl">座標</div><div id="coords" style="color:#aef;font-size:10px">0, 0, 0</div>
    <div class="lbl">速度</div><div id="spd">0.0</div>
    <div class="lbl">燃料</div><div class="bar"><div class="brf" id="bf" style="width:100%"></div></div>
    <div class="lbl">護盾</div><div class="bar"><div class="brs" id="bs" style="width:100%"></div></div>
  </div>
  <div class="panel" id="p-tr">
    <div style="font-size:12px;color:#0ff;letter-spacing:2px;margin-bottom:3px">◈ SCANNER</div>
    <div class="lbl">已發現</div><div id="disc" style="color:#fa0;font-size:14px">0 行星</div>
    <div class="lbl">附近</div><div id="near" style="font-size:10px">掃描中</div>
    <div class="lbl">狀態</div><div id="stat" style="color:#0f8;font-size:10px">太空飛行</div>
  </div>
  <div class="panel" id="p-bc"></div>
</div>

<canvas id="minimap" width="110" height="110"></canvas>
<div id="prompt"></div>

<div id="touch-ui">
  <div id="joy-zone">
    <div id="joy-base"><div id="joy-knob"></div></div>
  </div>
  <div id="btn-area">
    <div id="zrow"><div class="btn" id="bzi">+</div><div class="btn" id="bzo">−</div></div>
    <div class="btn" id="btn-b">⚡<br>加速</div>
    <div class="btn" id="btn-e">E</div>
  </div>
</div>

<div id="hint">WASD/方向鍵 · E進入星球 · 滾輪縮放 · 手機搖桿操控</div>
<div id="fade"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||window.innerWidth<768;
let W=window.innerWidth, H=window.innerHeight;

// ─── Three.js Init ──────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000008);
scene.fog = new THREE.FogExp2(0x000008, 0.000008);

const cam = new THREE.PerspectiveCamera(65, W/H, 0.5, 200000);
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c3d'), antialias: !isMobile, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile?1.2:2));
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;

// Ambient + directional light (sun)
scene.add(new THREE.AmbientLight(0x111a2a, 1.5));
const sunLight = new THREE.DirectionalLight(0xfff5e0, 2.5);
sunLight.position.set(1000, 800, 500);
scene.add(sunLight);

// ─── PRNG ───────────────────────────────────────────────────────────────────
function srng(s){let v=s>>>0;return()=>{v=(v*1664525+1013904223)>>>0;return v/0x100000000;};}
function h2(x,y){return Math.abs((x*73856093)^(y*19349663))%2147483647;}

// ─── State ─────────────────────────────────────────────────────────────────
const GS={SPACE:'space',PLANET:'planet',TRANS:'trans'};
let gs=GS.SPACE, clock=new THREE.Clock(), ticks=0;

const ship={
  group:null, pos:new THREE.Vector3(0,0,0),
  vel:new THREE.Vector3(), yaw:0, pitch:0, roll:0,
  speed:0, fuel:100, shield:100
};
const surfPlayer={pos:new THREE.Vector3(0,0,0),vel:new THREE.Vector3(),grounded:false};
let nearPlanet=null, discovered=new Set(), currentSurface=null;

// ─── Input ─────────────────────────────────────────────────────────────────
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='e'||e.key==='E')doE();});
window.addEventListener('keyup',e=>delete keys[e.key]);
window.addEventListener('wheel',e=>{
  if(gs===GS.SPACE){camDist=Math.max(20,Math.min(200,camDist*(e.deltaY>0?1.1:.9)));}
  e.preventDefault();
},{passive:false});
function isKey(...k){return k.some(x=>keys[x]);}

// Touch joystick
const JOY={active:false,id:null,bx:0,by:0,dx:0,dy:0,R:48};
let touchBoost=false, ziH=false, zoH=false;

const jBase=document.getElementById('joy-base'), jKnob=document.getElementById('joy-knob');
document.getElementById('joy-zone').addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches) if(!JOY.active){
    JOY.active=true;JOY.id=t.identifier;JOY.bx=t.clientX;JOY.by=t.clientY;JOY.dx=0;JOY.dy=0;
    jBase.style.display='block';jBase.style.left=t.clientX+'px';jBase.style.top=t.clientY+'px';
  }
},{passive:false});
document.getElementById('joy-zone').addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches) if(t.identifier===JOY.id){
    const dx=t.clientX-JOY.bx, dy=t.clientY-JOY.by, d=Math.hypot(dx,dy), cl=Math.min(d,JOY.R), a=Math.atan2(dy,dx);
    JOY.dx=cl/JOY.R*Math.cos(a); JOY.dy=cl/JOY.R*Math.sin(a);
    jKnob.style.left=(50+JOY.dx*50)+'%'; jKnob.style.top=(50+JOY.dy*50)+'%';
  }
},{passive:false});
function jEnd(e){e.preventDefault();for(const t of e.changedTouches)if(t.identifier===JOY.id){JOY.active=false;JOY.dx=0;JOY.dy=0;jBase.style.display='none';}}
document.getElementById('joy-zone').addEventListener('touchend',jEnd,{passive:false});
document.getElementById('joy-zone').addEventListener('touchcancel',jEnd,{passive:false});

// Pinch zoom
let pinchD=0,pinching=false;
document.getElementById('c3d').addEventListener('touchstart',e=>{if(e.touches.length===2){pinching=true;pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}},{passive:false});
document.getElementById('c3d').addEventListener('touchmove',e=>{e.preventDefault();if(pinching&&e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);camDist=Math.max(20,Math.min(200,camDist*pinchD/d));pinchD=d;}},{passive:false});
document.getElementById('c3d').addEventListener('touchend',e=>{if(e.touches.length<2)pinching=false;},{passive:false});

function holdBtn(el,on,off){
  el.addEventListener('touchstart',e=>{e.preventDefault();on();el.classList.add('on');},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();off();el.classList.remove('on');},{passive:false});
  el.addEventListener('touchcancel',e=>{off();el.classList.remove('on');},{passive:false});
  el.addEventListener('mousedown',()=>{on();el.classList.add('on');});
  el.addEventListener('mouseup',()=>{off();el.classList.remove('on');});
  el.addEventListener('mouseleave',()=>{off();el.classList.remove('on');});
}
holdBtn(document.getElementById('btn-b'),()=>touchBoost=true,()=>touchBoost=false);
holdBtn(document.getElementById('bzi'),()=>ziH=true,()=>ziH=false);
holdBtn(document.getElementById('bzo'),()=>zoH=true,()=>zoH=false);
document.getElementById('btn-e').addEventListener('touchstart',e=>{e.preventDefault();doE();},{passive:false});
document.getElementById('btn-e').addEventListener('mousedown',doE);

// ─── Biomes ──────────────────────────────────────────────────────────────────
const BIOMES=[
  {name:'翠綠星球',col:0x2d8a2d,atm:0x40cc40,sky:0x071507,gnd:0x1a4a1a,grass:0x3aaa3a,type:'lush'},
  {name:'沙漠星球',col:0xc8882a,atm:0xd4a050,sky:0x1a0e00,gnd:0x8a5a10,grass:0xc8a040,type:'desert'},
  {name:'冰雪星球',col:0xaae0ff,atm:0x88ccff,sky:0x040818,gnd:0x90c8f0,grass:0xd0f0ff,type:'ice'},
  {name:'熔岩星球',col:0xcc2200,atm:0xff4400,sky:0x100000,gnd:0x3a0800,grass:0xff4400,type:'lava'},
  {name:'毒素星球',col:0x88ff44,atm:0x66ee22,sky:0x001300,gnd:0x1a3a00,grass:0x88ff44,type:'toxic'},
  {name:'海洋星球',col:0x0088cc,atm:0x0099ee,sky:0x000818,gnd:0x002244,grass:0x00aaff,type:'ocean'},
  {name:'晶體星球',col:0xcc44ff,atm:0xaa22dd,sky:0x080018,gnd:0x1a0040,grass:0xcc88ff,type:'crystal'},
  {name:'荒蕪星球',col:0x888888,atm:0x666666,sky:0x040404,gnd:0x444444,grass:0x666666,type:'dead'},
];
const SYL=['nor','man','sky','ara','kel','zen','vox','nar','lys','tal','el','os','ix','an','ia','or','us'];
function plName(seed){const r=srng(seed);let n='';for(let i=0;i<2+Math.floor(r()*2);i++){const s=SYL[Math.floor(r()*SYL.length)];n+=i?s:s[0].toUpperCase()+s.slice(1);}return n;}

// ─── Star Field ───────────────────────────────────────────────────────────────
(function(){
  const cnt=isMobile?3000:6000, pos=new Float32Array(cnt*3), col=new Float32Array(cnt*3);
  for(let i=0;i<cnt;i++){
    const r=60000+Math.random()*80000, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
    const t=Math.random();
    const c=t<.6?[1,1,1]:t<.75?[.7,.9,1]:t<.85?[1,.9,.7]:[1,.7,.7];
    col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2];
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:2,vertexColors:true,sizeAttenuation:false})));
})();

// ─── Sector Cache ────────────────────────────────────────────────────────────
const SEC=8000;
const secCache=new Map(); // sectorKey → {data[], meshes[]}

function secKey(sx,sy){return`${sx},${sy}`;}

function genSecData(sx,sy){
  const r=srng(h2(sx,sy)), objs=[];
  const pc=1+Math.floor(r()*4);
  for(let i=0;i<pc;i++){
    const px=sx*SEC+700+r()*(SEC-1400), pz=sy*SEC+700+r()*(SEC-1400);
    const seed=h2(Math.floor(px/10),Math.floor(pz/10));
    const bi=BIOMES[Math.floor(r()*BIOMES.length)];
    const rad=60+r()*130;
    objs.push({type:'planet',px,pz,seed,bi,rad,name:plName(seed),
      ring:r()<.3,rTilt:r()*.6,moon:r()<.4,mDist:rad*2.4+r()*rad,mRad:8+r()*22,mAngle:r()*Math.PI*2,mSpeed:.001+r()*.003,
      clouds:Math.floor(r()*8),rotY:0,rotSpd:(r()-.5)*.003});
  }
  if(r()<.1) objs.push({type:'bh',px:sx*SEC+r()*SEC,pz:sy*SEC+r()*SEC,rad:80+r()*90});
  const ac=r()<.5?5+Math.floor(r()*10):0;
  const ax=sx*SEC+r()*SEC, az=sy*SEC+r()*SEC;
  for(let i=0;i<ac;i++) objs.push({type:'ast',px:ax+(r()-.5)*600,pz:az+(r()-.5)*600,rad:6+r()*25,seed:Math.floor(r()*9999)});
  return objs;
}

function spawnSecMeshes(sx,sy,data){
  const meshes=[];
  for(const o of data){
    if(o.type==='planet') meshes.push(createPlanetMesh(o));
    else if(o.type==='bh') meshes.push(createBHMesh(o));
    else if(o.type==='ast') meshes.push(createAstMesh(o));
  }
  meshes.forEach(m=>scene.add(m));
  return meshes;
}

const activeSecs=new Map();
function updateSectors(){
  const px=Math.floor(ship.pos.x/SEC), pz=Math.floor(ship.pos.z/SEC);
  const R=2;
  // Remove far sectors
  for(const [k,s] of activeSecs){
    const [sx,sz]=k.split(',').map(Number);
    if(Math.abs(sx-px)>R+1||Math.abs(sz-pz)>R+1){s.meshes.forEach(m=>{scene.remove(m);m.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material){if(Array.isArray(c.material))c.material.forEach(x=>x.dispose());else c.material.dispose();}});});activeSecs.delete(k);}
  }
  // Add nearby sectors
  for(let sx=px-R;sx<=px+R;sx++) for(let sz=pz-R;sz<=pz+R;sz++){
    const k=secKey(sx,sz);
    if(!activeSecs.has(k)){
      if(!secCache.has(k))secCache.set(k,genSecData(sx,sz));
      const data=secCache.get(k);
      const meshes=spawnSecMeshes(sx,sz,data);
      activeSecs.set(k,{data,meshes});
    }
  }
}

// ─── Planet Mesh ─────────────────────────────────────────────────────────────
function createPlanetMesh(o){
  const g=new THREE.Group();
  g.position.set(o.px,0,o.pz);
  g.userData={planetData:o};

  // Sphere
  const seg=isMobile?24:32;
  const sphere=new THREE.Mesh(
    new THREE.SphereGeometry(o.rad,seg,seg),
    new THREE.MeshPhongMaterial({color:o.bi.col,shininess:18,emissive:new THREE.Color(o.bi.col).multiplyScalar(.04)})
  );
  g.add(sphere);

  // Atmosphere (glow shell)
  const atm=new THREE.Mesh(
    new THREE.SphereGeometry(o.rad*1.18,16,16),
    new THREE.MeshBasicMaterial({color:o.bi.atm,transparent:true,opacity:.25,side:THREE.BackSide,depthWrite:false})
  );
  g.add(atm);

  // Outer atmosphere glow
  const glow=new THREE.Mesh(
    new THREE.SphereGeometry(o.rad*1.45,16,16),
    new THREE.MeshBasicMaterial({color:o.bi.atm,transparent:true,opacity:.08,side:THREE.BackSide,depthWrite:false})
  );
  g.add(glow);

  // Ring
  if(o.ring){
    const ringG=new THREE.TorusGeometry(o.rad*2,o.rad*.14,6,64);
    const ring=new THREE.Mesh(ringG,new THREE.MeshBasicMaterial({color:o.bi.col,transparent:true,opacity:.55,side:THREE.DoubleSide,depthWrite:false}));
    ring.rotation.x=Math.PI/2+o.rTilt*.5;
    g.add(ring);
  }

  // Moon
  if(o.moon){
    const moon=new THREE.Mesh(
      new THREE.SphereGeometry(o.mRad,12,12),
      new THREE.MeshPhongMaterial({color:0xaaaaaa,shininess:5})
    );
    moon.userData.isMoon=true;
    g.add(moon);
  }

  // Name label (sprite)
  g.userData.sphere=sphere;
  return g;
}

// ─── Black Hole Mesh ─────────────────────────────────────────────────────────
function createBHMesh(o){
  const g=new THREE.Group();
  g.position.set(o.px,0,o.pz);
  g.userData={bhData:o};

  // Event horizon
  g.add(new THREE.Mesh(new THREE.SphereGeometry(o.rad,.32,32),new THREE.MeshBasicMaterial({color:0x000000})));

  // Glow
  g.add(new THREE.Mesh(new THREE.SphereGeometry(o.rad*1.25,16,16),new THREE.MeshBasicMaterial({color:0x220044,transparent:true,opacity:.4,side:THREE.BackSide,depthWrite:false})));

  // Accretion disk rings
  const colors=[0xff8800,0xffaa00,0xff5500];
  for(let i=0;i<3;i++){
    const ring=new THREE.Mesh(
      new THREE.TorusGeometry(o.rad*(1.5+i*.25),o.rad*(.12-.02*i),6,64),
      new THREE.MeshBasicMaterial({color:colors[i],transparent:true,opacity:.7-i*.12,side:THREE.DoubleSide,depthWrite:false})
    );
    ring.rotation.x=Math.PI/2+i*.15;
    ring.userData.isBHRing=true;
    ring.userData.ringIdx=i;
    g.add(ring);
  }

  // Point light
  const pl2=new THREE.PointLight(0xff6600,3,o.rad*8);
  g.add(pl2);
  return g;
}

// ─── Asteroid Mesh ───────────────────────────────────────────────────────────
function createAstMesh(o){
  const geo=new THREE.IcosahedronGeometry(o.rad,1);
  const pos=geo.attributes.position;
  const r=srng(o.seed);
  for(let i=0;i<pos.count;i++){
    pos.setXYZ(i,pos.getX(i)*(0.7+r()*.6),pos.getY(i)*(0.7+r()*.6),pos.getZ(i)*(0.7+r()*.6));
  }
  pos.needsUpdate=true;
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:0x776655,shininess:5}));
  m.position.set(o.px,0,o.pz);
  m.userData={astData:o,rotAx:new THREE.Vector3(r(),r(),r()).normalize(),rotSpd:(r()-.5)*.02};
  return m;
}

// ─── Ship Mesh ───────────────────────────────────────────────────────────────
function createShip(){
  const g=new THREE.Group();

  // Body
  const body=new THREE.Mesh(
    new THREE.CylinderGeometry(.5,3,18,8),
    new THREE.MeshPhongMaterial({color:0x3377bb,shininess:120,emissive:0x0a2244})
  );
  body.rotation.x=Math.PI/2; g.add(body);

  // Nose cone
  const nose=new THREE.Mesh(
    new THREE.ConeGeometry(3,8,8),
    new THREE.MeshPhongMaterial({color:0x4499dd,shininess:150,emissive:0x112233})
  );
  nose.rotation.x=-Math.PI/2; nose.position.z=-13; g.add(nose);

  // Wings
  const wMat=new THREE.MeshPhongMaterial({color:0x225588,shininess:80,side:THREE.DoubleSide});
  [[1,1],[-1,1]].forEach(([sx])=>{
    const wing=new THREE.Mesh(new THREE.BufferGeometry(),wMat.clone());
    const verts=new Float32Array([0,0,0, sx*12,-1.5,7, sx*8,0,-2, sx*4,0,-5, sx*3,0,-8]);
    const idx=new Uint16Array([0,1,2,0,2,3,0,3,4]);
    wing.geometry.setAttribute('position',new THREE.BufferAttribute(verts,3));
    wing.geometry.setIndex(new THREE.BufferAttribute(idx,1));
    wing.geometry.computeVertexNormals();
    g.add(wing);
  });

  // Cockpit
  const cockpit=new THREE.Mesh(
    new THREE.SphereGeometry(2.5,12,8,0,Math.PI*2,0,Math.PI*.5),
    new THREE.MeshPhongMaterial({color:0x44aaff,transparent:true,opacity:.7,shininess:200,emissive:0x002244})
  );
  cockpit.position.set(0,1.5,-7); g.add(cockpit);

  // Engine glow
  const engGeo=new THREE.SphereGeometry(2.2,8,8);
  const engMat=new THREE.MeshBasicMaterial({color:0x0088ff,transparent:true,opacity:.7});
  const eng=new THREE.Mesh(engGeo,engMat);
  eng.position.z=9; g.add(eng);
  const engLight=new THREE.PointLight(0x0088ff,0,30);
  engLight.position.z=9; g.add(engLight);
  g.userData.engMat=engMat; g.userData.engLight=engLight;

  scene.add(g);
  return g;
}

ship.group=createShip();
ship.group.position.copy(ship.pos);

// ─── Camera ──────────────────────────────────────────────────────────────────
let camDist=55, camHeight=14;
const camTarget=new THREE.Vector3();
const camPos=new THREE.Vector3();

function updateSpaceCam(dt){
  if(ziH)camDist=Math.max(20,camDist*.97);
  if(zoH)camDist=Math.min(200,camDist*1.03);
  const fwd=new THREE.Vector3(Math.sin(ship.yaw),Math.sin(ship.pitch),-Math.cos(ship.yaw));
  const back=fwd.clone().negate();
  const up=new THREE.Vector3(0,1,0);
  camTarget.copy(ship.pos).addScaledVector(fwd,20);
  const desiredPos=ship.pos.clone().addScaledVector(back,camDist).addScaledVector(up,camHeight);
  camPos.lerp(desiredPos,.06);
  cam.position.copy(camPos);
  cam.lookAt(camTarget);
}

let surfCamYaw=0, surfCamPitch=.25;
function updateSurfaceCam(){
  const target=surfPlayer.pos.clone().add(new THREE.Vector3(0,2,0));
  const bx=Math.sin(surfCamYaw)*Math.cos(surfCamPitch)*15;
  const by=Math.sin(surfCamPitch)*15+2;
  const bz=Math.cos(surfCamYaw)*Math.cos(surfCamPitch)*15;
  cam.position.set(target.x+bx,target.y+by,target.z+bz);
  cam.lookAt(target);
}

// ─── Planet Surface ───────────────────────────────────────────────────────────
const SURF_W=250, SURF_SEG=80;
let surfGroup=null, terrainMesh=null, playerMesh=null, raycaster=new THREE.Raycaster();

function fbm(x,z,offsets){
  let v=0,a=1,f=.025;
  for(let i=0;i<4;i++){v+=a*(Math.sin(x*f+offsets[i*2])*Math.cos(z*f+offsets[i*2+1]));a*=.5;f*=2.2;}
  return v*28;
}

function genSurface(planetData){
  surfGroup=new THREE.Group(); scene.add(surfGroup);

  // Sky color
  scene.background=new THREE.Color(planetData.bi.sky);
  scene.fog=new THREE.FogExp2(planetData.bi.sky,.006);

  // Sun
  const sunG=new THREE.PointLight(0xfff5e0,3,3000);
  sunG.position.set(-400,600,-300); surfGroup.add(sunG);
  surfGroup.add(new THREE.AmbientLight(planetData.bi.atm,0.4));

  // Terrain
  const geo=new THREE.PlaneGeometry(SURF_W,SURF_W,SURF_SEG,SURF_SEG);
  geo.rotateX(-Math.PI/2);
  const r=srng(planetData.seed);
  const offs=[r()*100,r()*100,r()*100,r()*100,r()*100,r()*100,r()*100,r()*100];
  const pos=geo.attributes.position;
  const colors=new Float32Array(pos.count*3);
  const grassC=new THREE.Color(planetData.bi.grass), gndC=new THREE.Color(planetData.bi.gnd);
  const lowC=new THREE.Color(planetData.bi.gnd).multiplyScalar(.6);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    const h=fbm(x,z,offs);
    pos.setY(i,h);
    const t=Math.max(0,Math.min(1,(h+30)/50));
    const c=h>5?grassC.clone().lerp(gndC,1-t):gndC.clone().lerp(lowC,Math.max(0,-h/20));
    colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;
  }
  pos.needsUpdate=true;
  geo.computeVertexNormals();
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  terrainMesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({vertexColors:true,shininess:8}));
  surfGroup.add(terrainMesh);

  // Flora (instanced)
  const floraCount=isMobile?60:120;
  const trunkMat=new THREE.MeshPhongMaterial({color:planetData.bi.gnd});
  const crownMat=new THREE.MeshPhongMaterial({color:planetData.bi.grass});
  const trunkI=new THREE.InstancedMesh(new THREE.CylinderGeometry(.3,0.5,4,6),trunkMat,floraCount);
  const crownI=new THREE.InstancedMesh(new THREE.ConeGeometry(3,6,7),crownMat,floraCount);
  const dummy=new THREE.Object3D();
  for(let i=0;i<floraCount;i++){
    const fx=(r()-.5)*SURF_W*.9, fz=(r()-.5)*SURF_W*.9;
    const fy=getTerrainH(fx,fz,pos)+2;
    if(fy<-5)continue;
    dummy.position.set(fx,fy,fz); dummy.rotation.y=r()*Math.PI*2;
    const sc=0.6+r()*.8; dummy.scale.setScalar(sc); dummy.updateMatrix();
    trunkI.setMatrixAt(i,dummy.matrix);
    dummy.position.y+=4*sc; dummy.scale.y*=1.2; dummy.updateMatrix();
    crownI.setMatrixAt(i,dummy.matrix);
  }
  surfGroup.add(trunkI); surfGroup.add(crownI);

  // Rocks
  const rockI=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,1),new THREE.MeshPhongMaterial({color:planetData.bi.gnd,shininess:3}),30);
  for(let i=0;i<30;i++){
    const rx=(r()-.5)*SURF_W*.9, rz=(r()-.5)*SURF_W*.9;
    const ry=getTerrainH(rx,rz,pos);
    dummy.position.set(rx,ry,rz); dummy.rotation.set(r()*6,r()*6,r()*6);
    dummy.scale.setScalar(1+r()*3); dummy.updateMatrix();
    rockI.setMatrixAt(i,dummy.matrix);
  }
  surfGroup.add(rockI);

  // Creatures
  spawnCreatures(planetData,pos,r,surfGroup);

  // Player mesh
  if(playerMesh){surfGroup.add(playerMesh);}else{
    playerMesh=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CapsuleGeometry(1,3,6,8),new THREE.MeshPhongMaterial({color:0x4488cc}));
    const helmet=new THREE.Mesh(new THREE.SphereGeometry(1.2,12,8),new THREE.MeshPhongMaterial({color:0x2266aa,transparent:true,opacity:.7}));
    helmet.position.y=2.5;
    playerMesh.add(body); playerMesh.add(helmet);
    surfGroup.add(playerMesh);
  }

  // Place player
  const py=getTerrainH(0,0,pos)+3.5;
  surfPlayer.pos.set(0,py,0);
  surfPlayer.vel.set(0,0,0);
  surfPlayer.grounded=false;
  playerMesh.position.copy(surfPlayer.pos);
  surfCamYaw=0; surfCamPitch=.3;

  currentSurface={planetData,pos,offs};
}

function getTerrainH(wx,wz,posAttr){
  raycaster.set(new THREE.Vector3(wx,200,wz),new THREE.Vector3(0,-1,0));
  const hits=raycaster.intersectObject(terrainMesh);
  if(hits.length) return hits[0].point.y;
  if(posAttr){const i=Math.floor((wx/SURF_W+.5)*SURF_SEG),j=Math.floor((wz/SURF_W+.5)*SURF_SEG);const idx=j*(SURF_SEG+1)+i;if(idx>=0&&idx<posAttr.count)return posAttr.getY(idx);}
  return 0;
}

function spawnCreatures(planetData,pos,r,group){
  const cnt=4+Math.floor(r()*5);
  for(let i=0;i<cnt;i++){
    const cx=(r()-.5)*SURF_W*.7, cz=(r()-.5)*SURF_W*.7;
    const cy=getTerrainH(cx,cz,pos)+1.5;
    const cg=new THREE.Group();
    const cMat=new THREE.MeshPhongMaterial({color:new THREE.Color(`hsl(${r()*360},${60+r()*40}%,${40+r()*30}%)`)});
    const cBody=new THREE.Mesh(new THREE.CapsuleGeometry(.6,1.5,4,6),cMat);
    cg.add(cBody);
    const cHead=new THREE.Mesh(new THREE.SphereGeometry(.65,8,8),cMat.clone());
    cHead.position.y=1.6; cg.add(cHead);
    for(let l=0;l<4;l++){
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(.15,.1,1.2,4),cMat.clone());
      leg.position.set((l<2?-.5:.5)*0.6,-.9,(l%2===0?.3:-.3)); cg.add(leg);
    }
    cg.position.set(cx,cy,cz);
    cg.userData={spd:.4+r()*.6,dir:r()*Math.PI*2,legPhase:r()*Math.PI*2,surfPos:pos};
    group.add(cg);
    creatureMeshes.push(cg);
  }
}
const creatureMeshes=[];

function clearSurface(){
  if(surfGroup){scene.remove(surfGroup);surfGroup.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material){if(Array.isArray(c.material))c.material.forEach(x=>x.dispose());else c.material.dispose();}});surfGroup=null;terrainMesh=null;}
  creatureMeshes.length=0;
  scene.background=new THREE.Color(0x000008);
  scene.fog=new THREE.FogExp2(0x000008,0.000008);
  if(playerMesh&&playerMesh.parent)playerMesh.parent.remove(playerMesh);
}

// ─── Update Space ─────────────────────────────────────────────────────────────
function updateSpace(dt){
  const boost=(isKey('Shift')||touchBoost)?3:1;
  const ac=0.12*boost, maxSpd=14*boost;

  // Yaw
  const turnL=isKey('ArrowLeft','a','A')||JOY.dx<-.25;
  const turnR=isKey('ArrowRight','d','D')||JOY.dx>.25;
  if(turnL) ship.yaw-=.05*(JOY.active?0.5+Math.abs(JOY.dx):1);
  if(turnR) ship.yaw+=.05*(JOY.active?0.5+Math.abs(JOY.dx):1);
  ship.roll=turnL?-.4:turnR?.4:ship.roll*.85; // Visual banking

  // Pitch
  if(isKey('ArrowUp','w','W')||JOY.dy<-.3) ship.pitch=Math.max(-.5,ship.pitch-.02);
  else if(isKey('ArrowDown','s','S')||JOY.dy>.3) ship.pitch=Math.min(.5,ship.pitch+.02);
  else ship.pitch*=.92;

  // Thrust
  const thrusting=isKey('ArrowUp','w','W')||JOY.dy<-.3;
  const braking=isKey('ArrowDown','s','S')||JOY.dy>.3;
  const fwd=new THREE.Vector3(Math.sin(ship.yaw)*Math.cos(ship.pitch), -Math.sin(ship.pitch), -Math.cos(ship.yaw)*Math.cos(ship.pitch));
  if(thrusting){ship.vel.addScaledVector(fwd,ac);ship.fuel=Math.max(0,ship.fuel-.015*boost);}
  if(braking) ship.vel.addScaledVector(fwd,-ac*.5);

  ship.vel.multiplyScalar(.98);
  const spd=ship.vel.length();
  if(spd>maxSpd) ship.vel.setLength(maxSpd);
  ship.speed=Math.round(spd*10)/10;
  ship.pos.add(ship.vel);

  // Apply to mesh
  ship.group.position.copy(ship.pos);
  ship.group.rotation.y=-ship.yaw;
  ship.group.rotation.x=ship.pitch;
  ship.group.rotation.z=ship.roll;

  // Engine glow
  const eng=ship.group.userData;
  if(eng.engMat){eng.engMat.opacity=thrusting?.7+Math.sin(ticks*.4)*.2:.1;eng.engLight.intensity=thrusting?3:0;}

  // Black hole gravity
  for(const [,s] of activeSecs) for(const m of s.meshes){
    if(!m.userData.bhData)continue;
    const d=ship.pos.distanceTo(m.position);
    if(d<m.userData.bhData.rad*18){const f=8000/(d*d);ship.vel.addScaledVector(m.position.clone().sub(ship.pos).normalize(),f);}
  }

  if(ship.fuel<100) ship.fuel=Math.min(100,ship.fuel+.008);
  updateSectors();
  updateSpaceCam(dt);

  // Animate planets + BHs + asteroids
  for(const [,s] of activeSecs){
    for(const m of s.meshes){
      if(m.userData.planetData){
        const o=m.userData.planetData; o.rotY=(o.rotY||0)+o.rotSpd;
        m.children[0].rotation.y=o.rotY; // Rotate sphere
        // Moon
        m.children.forEach(c=>{if(c.userData.isMoon){c.position.set(Math.cos(o.mAngle)*o.mDist,0,Math.sin(o.mAngle)*o.mDist);o.mAngle+=o.mSpeed;}});
      }
      if(m.userData.bhData){
        m.children.forEach(c=>{if(c.userData.isBHRing){c.rotation.z+=.008*(c.userData.ringIdx+1);}});
      }
      if(m.userData.astData){m.rotateOnAxis(m.userData.rotAx,m.userData.rotSpd);}
    }
  }

  // Find near planet
  nearPlanet=null;
  for(const [,s] of activeSecs) for(const o of s.data){
    if(o.type==='planet'){
      const d=Math.hypot(ship.pos.x-o.px,ship.pos.z-o.pz);
      if(d<o.rad*1.9){nearPlanet=o;discovered.add(o.seed);}
    }
  }
}

// ─── Update Surface ─────────────────────────────────────────────────────────
function updateSurface(dt){
  if(!currentSurface||!terrainMesh)return;

  // Get camera forward direction projected onto XZ plane
  const camFwd=new THREE.Vector3(-Math.sin(surfCamYaw),0,-Math.cos(surfCamYaw));
  const camRight=new THREE.Vector3(Math.cos(surfCamYaw),0,-Math.sin(surfCamYaw));

  const mv=4;
  const moveVec=new THREE.Vector3();
  if(isKey('ArrowLeft','a','A')||JOY.dx<-.2) moveVec.addScaledVector(camRight,-mv*(JOY.active?0.5+Math.abs(JOY.dx)*.8:1));
  else if(isKey('ArrowRight','d','D')||JOY.dx>.2) moveVec.addScaledVector(camRight,mv*(JOY.active?0.5+Math.abs(JOY.dx)*.8:1));
  if(isKey('ArrowUp','w','W')||JOY.dy<-.2) moveVec.addScaledVector(camFwd,-mv*(JOY.active?0.5+Math.abs(JOY.dy)*.8:1));
  else if(isKey('ArrowDown','s','S')||JOY.dy>.2) moveVec.addScaledVector(camFwd,mv*(JOY.active?0.5+Math.abs(JOY.dy)*.8:1));

  surfPlayer.vel.x=moveVec.x; surfPlayer.vel.z=moveVec.z;
  surfPlayer.vel.y-=0.35; // Gravity

  if((isKey(' ','ArrowUp','w','W')||JOY.dy<-.5)&&surfPlayer.grounded){surfPlayer.vel.y=8;surfPlayer.grounded=false;}

  surfPlayer.pos.add(surfPlayer.vel.clone().multiplyScalar(dt));
  surfPlayer.pos.x=Math.max(-SURF_W*.45,Math.min(SURF_W*.45,surfPlayer.pos.x));
  surfPlayer.pos.z=Math.max(-SURF_W*.45,Math.min(SURF_W*.45,surfPlayer.pos.z));

  const gh=getTerrainH(surfPlayer.pos.x,surfPlayer.pos.z,currentSurface.pos)+3.5;
  if(surfPlayer.pos.y<=gh){surfPlayer.pos.y=gh;surfPlayer.vel.y=0;surfPlayer.grounded=true;}else surfPlayer.grounded=false;

  playerMesh.position.copy(surfPlayer.pos);
  if(moveVec.lengthSq()>0.01) playerMesh.rotation.y=-Math.atan2(moveVec.x,moveVec.z);

  // Animate creatures
  for(const c of creatureMeshes){
    c.userData.dir+=(Math.random()-.5)*.05;
    c.position.x+=Math.sin(c.userData.dir)*c.userData.spd*dt;
    c.position.z+=Math.cos(c.userData.dir)*c.userData.spd*dt;
    c.position.x=Math.max(-SURF_W*.4,Math.min(SURF_W*.4,c.position.x));
    c.position.z=Math.max(-SURF_W*.4,Math.min(SURF_W*.4,c.position.z));
    const gy=getTerrainH(c.position.x,c.position.z,currentSurface.pos)+1.5;
    c.position.y+=(gy-c.position.y)*.15;
    c.rotation.y=c.userData.dir;
    c.userData.legPhase+=0.12;
    // Animate legs
    c.children.slice(2).forEach((leg,i)=>{leg.rotation.x=Math.sin(c.userData.legPhase+(i*.5))*.4;});
  }

  updateSurfaceCam();
}

// ─── Transitions ─────────────────────────────────────────────────────────────
function doE(){
  if(gs===GS.TRANS)return;
  if(gs===GS.SPACE&&nearPlanet) enterPlanet(nearPlanet);
  else if(gs===GS.PLANET) exitPlanet();
}

function enterPlanet(pd){
  gs=GS.TRANS;
  const fd=document.getElementById('fade'); fd.style.opacity=1;
  ship.group.visible=false;
  setTimeout(()=>{
    genSurface(pd);
    gs=GS.PLANET;
    const bc=document.getElementById('p-bc');
    bc.style.display='block'; bc.textContent=`▶ ${pd.name} — ${pd.bi.name}`;
    fd.style.opacity=0;
  },700);
}

function exitPlanet(){
  gs=GS.TRANS;
  const fd=document.getElementById('fade'); fd.style.opacity=1;
  setTimeout(()=>{
    clearSurface();
    ship.group.visible=true;
    gs=GS.SPACE;
    document.getElementById('p-bc').style.display='none';
    updateSectors();
    fd.style.opacity=0;
  },600);
}

// ─── Minimap ─────────────────────────────────────────────────────────────────
const mmCanvas=document.getElementById('minimap');
const mctx=mmCanvas.getContext('2d');
function drawMinimap(){
  mctx.clearRect(0,0,110,110);
  mctx.fillStyle='rgba(0,5,15,.9)'; mctx.fillRect(0,0,110,110);
  const cx=55,cy=55,sc=.004;
  if(gs===GS.SPACE){
    for(const[,s]of activeSecs)for(const o of s.data){
      if(o.type==='planet'){const mx=cx+(o.px-ship.pos.x)*sc,my=cy+(o.pz-ship.pos.z)*sc;if(mx<4||mx>106||my<4||my>106)continue;mctx.beginPath();mctx.arc(mx,my,Math.max(2,o.rad*sc*10),0,Math.PI*2);mctx.fillStyle=discovered.has(o.seed)?'#fa0':`#${o.bi.col.toString(16).padStart(6,'0')}`;mctx.fill();}
      if(o.type==='bh'){const mx=cx+(o.px-ship.pos.x)*sc,my=cy+(o.pz-ship.pos.z)*sc;if(mx<4||mx>106||my<4||my>106)continue;mctx.beginPath();mctx.arc(mx,my,4,0,Math.PI*2);mctx.fillStyle='#f80';mctx.fill();}
    }
    // Ship direction
    mctx.save();mctx.translate(cx,cy);mctx.rotate(ship.yaw);
    mctx.fillStyle='#0ff';mctx.beginPath();mctx.moveTo(0,-5);mctx.lineTo(-3,3);mctx.lineTo(3,3);mctx.closePath();mctx.fill();
    mctx.restore();
  } else {
    mctx.fillStyle='rgba(0,100,0,.4)'; mctx.fillRect(5,5,100,100);
    const px=cx+(surfPlayer.pos.x/(SURF_W*.5))*50, py=cy+(surfPlayer.pos.z/(SURF_W*.5))*50;
    mctx.fillStyle='#0ff'; mctx.beginPath(); mctx.arc(px,py,3,0,Math.PI*2); mctx.fill();
  }
  mctx.beginPath();mctx.arc(55,55,54,0,Math.PI*2);mctx.strokeStyle='rgba(0,255,200,.25)';mctx.lineWidth=1;mctx.stroke();
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function updateHUD(){
  const p=gs===GS.PLANET?surfPlayer.pos:ship.pos;
  document.getElementById('coords').textContent=`${Math.round(p.x/100)}, ${Math.round(p.y/100)}, ${Math.round(p.z/100)}`;
  document.getElementById('spd').textContent=(gs===GS.SPACE?ship.speed:Math.hypot(surfPlayer.vel.x,surfPlayer.vel.z).toFixed(1))+' AU/s';
  document.getElementById('bf').style.width=ship.fuel+'%';
  document.getElementById('bs').style.width=ship.shield+'%';
  document.getElementById('disc').textContent=discovered.size+' 行星';
  document.getElementById('near').textContent=nearPlanet?nearPlanet.name:'無';
  const st=document.getElementById('stat');
  st.textContent=gs===GS.PLANET?'地表探索':'太空飛行';
  st.style.color=gs===GS.PLANET?'#fa0':'#0f8';
  const pr=document.getElementById('prompt');
  if(gs===GS.SPACE&&nearPlanet){pr.style.display='block';pr.textContent=`按 E 降落 ${nearPlanet.name}`;}
  else if(gs===GS.PLANET){pr.style.display='block';pr.textContent='按 E 返回太空';}
  else pr.style.display='none';
}

// ─── Main Loop ────────────────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  ticks++;

  if(gs===GS.SPACE) updateSpace(dt);
  else if(gs===GS.PLANET) updateSurface(dt);

  renderer.render(scene,cam);
  updateHUD();
  drawMinimap();
}

window.addEventListener('resize',()=>{
  W=window.innerWidth; H=window.innerHeight;
  cam.aspect=W/H; cam.updateProjectionMatrix();
  renderer.setSize(W,H);
});
document.addEventListener('contextmenu',e=>e.preventDefault());

updateSectors();
loop();
</script>
